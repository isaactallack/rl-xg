# Collects C3-GC2 ranked-doubles replays from ballchasing into an Azure blob container,
# so nothing has to run at home. The free API tier allows 200 replays an hour, so each run
# does BATCHES batches of up to 190, one an hour, then starts the next run itself.
# GitHub's cron is too unreliable to drive this (it can skip hours), so the schedule below
# is only a fallback that restarts the chain if it ever breaks; the concurrency group keeps
# it from running alongside the chain. Stops once the container holds STOP_AT replays.
# Pull them down with:  python scripts/download_ballchasing.py pull
#
# Secrets: BALLCHASING_TOKEN, AZURE_BLOB_CONTAINER_URL (container URL + SAS token).
# Note: GitHub pauses scheduled workflows after 60 days without commits to the repo.
name: Collect ballchasing replays

on:
  schedule:
    - cron: "23 */6 * * *"
  workflow_dispatch:
    inputs:
      max_files:
        description: "Replays per batch (max 190 on the free tier)"
        default: "190"

concurrency:
  group: ballchasing
  cancel-in-progress: false

permissions:
  contents: read
  issues: write      # to open the "collection complete" issue
  actions: write     # to start the next run, and to disable this workflow once it's done

env:
  STOP_AT: "20000"
  BATCHES: "5"       # one an hour; 5 hours keeps the run well inside GitHub's 6-hour job limit

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "azure-storage-blob>=12.19"
      - name: Download replays into Azure, one batch an hour
        id: fetch
        env:
          BALLCHASING_TOKEN: ${{ secrets.BALLCHASING_TOKEN }}
          AZURE_BLOB_CONTAINER_URL: ${{ secrets.AZURE_BLOB_CONTAINER_URL }}
        run: |
          for i in $(seq 1 "$BATCHES"); do
            start=$(date +%s)
            echo "::group::batch $i/$BATCHES"
            # A failed batch (network blip, API error) shouldn't end the chain; the next one retries.
            python scripts/download_ballchasing.py fetch --blob \
              --interval 1.1 --max-files ${{ inputs.max_files || '190' }} --stop-at "$STOP_AT" \
              || echo "::warning::batch $i failed"
            echo "::endgroup::"
            if grep -q '^full=true' "$GITHUB_OUTPUT"; then exit 0; fi
            # Wait out the rest of the hour, including after the last batch, so the next
            # run's first batch starts with a fresh rate-limit window.
            wait=$(( start + 3600 - $(date +%s) ))
            if [ "$wait" -gt 0 ]; then sleep "$wait"; fi
          done
      - name: Start the next run
        if: steps.fetch.outputs.full != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ballchasing.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME" -f max_files=${{ inputs.max_files || '190' }}
      - name: Collection complete - open an issue (emails you) and switch this workflow off
        if: steps.fetch.outputs.full == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "Ballchasing collection complete (${{ steps.fetch.outputs.count }} replays)" \
            --body "The Azure container holds ${{ steps.fetch.outputs.count }} replays, so the collector has disabled itself. Next: steps 2-3 of docs/final_rebuild.md (pull, then shut down Azure)."
          gh workflow disable ballchasing.yml --repo "$GITHUB_REPOSITORY"
